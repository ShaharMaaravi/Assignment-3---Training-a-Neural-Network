[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-racer"
version = "0.1.0"
description = "A top-down racing simulator for evolving Keras neural-network drivers."
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
evo-racer = "evo_racer.simulation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
